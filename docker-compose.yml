services:
  backend:
    build: .
    container_name: college-event-container
    ports:
      - "5000:5000"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: college-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 2468
      MYSQL_DATABASE: college_event_db
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  nginx:
    image: nginx:alpine
    container_name: college-nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend